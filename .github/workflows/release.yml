name: Release SDK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-sdk:
    name: Windows SDK package
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build native library
        shell: pwsh
        run: |
          cmake --build build `
            --config RelWithDebInfo `
            --target wisteria_native `
            --parallel

      - name: Package SDK
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          .\script\package_sdk.ps1 `
            -Configuration RelWithDebInfo `
            -BuildPath .\build `
            -Version $version

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-sdk
          path: artifacts/sdk/*.zip
          if-no-files-found: error

  linux-sdk:
    name: Linux SDK package
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libegl1-mesa-dev

      - name: Configure
        run: |
          cmake -S . -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DWISTERIA_LINUX_WINDOW_BACKEND=NULL \
            -DWISTERIA_BUILD_NATIVE=ON

      - name: Build native library
        run: cmake --build build-linux --target wisteria_native --parallel

      - name: Install SDK component
        run: |
          cmake --install build-linux \
            --prefix "$RUNNER_TEMP/sdk-package" \
            --component wisteria-sdk

      - name: Create Linux SDK archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          sdk_root="$RUNNER_TEMP/sdk-package"
          cp LICENSE "$sdk_root/LICENSE.txt"
          cp docs/SDK.md "$sdk_root/SDK.md"
          printf '%s' "$version" > "$sdk_root/WISTERIA_SDK_VERSION"
          mkdir -p artifacts/sdk
          tar -czf \
            "artifacts/sdk/wisteria-sdk-${version}-linux-x86_64.tar.gz" \
            -C "$sdk_root" .

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-sdk
          path: artifacts/sdk/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - windows-sdk
      - linux-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download SDK artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Extract release notes section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## / {
              if (found) exit
              if (index($0, ver) > 0) { found = 1; print; next }
            }
            found { print }
          ' RELEASE_NOTES.md > release-body.md

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: |
            release-artifacts/windows-sdk/*
            release-artifacts/linux-sdk/*
